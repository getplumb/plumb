name: PII & Secrets Scan

on:
  push:
  pull_request:
    branches: [main, production]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          # .gitleaksignore is auto-detected by gitleaks (fingerprint format for known-safe historical commits)
          gitleaks git \
            --redact \
            --verbose \
            --exit-code 1 \
            || (echo ""; echo "🚫 Secrets detected. Add fingerprint to .gitleaksignore if this is a known false positive."; exit 1)

  pii-grep:
    name: PII Pattern Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for known PII patterns
        env:
          # The pattern list lives in a repository secret, not in this file.
          # Storing "block my home address" patterns in a public repo publishes
          # the address in trivially readable form -- the scanner became the
          # worst leak it was guarding against. Secret format: one regex per
          # line. Never echoed; matches report a pattern INDEX, never its text.
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          set -uo pipefail

          if [ -z "${PII_PATTERNS:-}" ]; then
            echo "::error::PII_PATTERNS secret is not set. Refusing to pass a scan that checked nothing."
            echo "Add a repository secret named PII_PATTERNS: one regex per line."
            exit 1
          fi

          printf '%s\n' "$PII_PATTERNS" > /tmp/pii-patterns.txt
          COUNT=$(grep -cve '^[[:space:]]*$' /tmp/pii-patterns.txt || true)
          echo "Loaded $COUNT pattern(s) from the secret."

          FAILED=0
          INDEX=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            INDEX=$((INDEX + 1))
            MATCHES=$(grep -rInP "$pattern" \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='*.cjs' \
              --include='*.json' --include='*.md' --include='*.mdx' --include='*.toml' \
              --include='*.yaml' --include='*.yml' --include='*.txt' --include='*.html' \
              --include='*.sh' --include='*.py' --include='*.service' \
              . 2>/dev/null | grep -v 'node_modules/' | grep -v '\.git/' || true)
            if [ -n "$MATCHES" ]; then
              # File and line only. Printing the match would re-leak the value.
              echo "::error::PII pattern #$INDEX matched:"
              echo "$MATCHES" | cut -d: -f1,2 | sort -u
              FAILED=1
            fi
          done < /tmp/pii-patterns.txt
          rm -f /tmp/pii-patterns.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "PII detected in tracked files. Remove before pushing."
            exit 1
          fi
          echo "No PII patterns found."
