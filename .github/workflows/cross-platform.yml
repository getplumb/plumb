name: Cross-Platform Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Run before publishing to catch issues early
  workflow_dispatch:
    inputs:
      run_install_smoke:
        description: 'Run full pack+install smoke test'
        type: boolean
        default: false

# -------------------------------------------------------------------
# STRATEGY
#
# Two layers, cheapest first.
#
# 1. build-and-unit — build the monorepo and run the unit suites on every
#    OS x Node combination. Catches path-separator bugs, ESM/CJS problems, and
#    anything that fails to compile on a platform.
#
#    Note what this layer CANNOT catch: the wiki-search-service suite skips
#    itself here, because its fixture is a snapshot of a real wiki kept in a
#    separate private repository. Skipping is the honest outcome -- inventing
#    assertions that pass without exercising retrieval would be worse. Layer 2
#    covers retrieval with a synthetic corpus instead.
#
# 2. install-smoke — pack the published packages, install them into a clean
#    directory the way a user would, then build an index, start the service and
#    run real queries against it. This is the layer that matters for a release:
#    it is the only place that proves an install works on a machine that is not
#    the maintainer's, and the only place a silent degradation to keyword-only
#    retrieval would be caught.
# -------------------------------------------------------------------

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build + unit tests
  # ----------------------------------------------------------------
  build-and-unit:
    name: Build & Unit (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # see all failures, not just the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.5.0 is the exact floor (node:sqlite DatabaseSync); 22 and 24 are the
        # live LTS lines. Testing the floor itself catches an accidental
        # dependency on a later API.
        node: ['22.5.0', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test
        env:
          # Vitest needs this on Windows to avoid interactive TTY issues
          CI: true

  # ----------------------------------------------------------------
  # Job 2: Pack + install + index + search
  # Simulates what a real user does, end to end.
  # ----------------------------------------------------------------
  install-smoke:
    name: Install Smoke (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_install_smoke)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.5.0', '22', '24']
        # Full OS coverage on the floor and on current; trim the middle line to
        # ubuntu to keep the matrix at 7 jobs rather than 9.
        exclude:
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @getplumb/core build
          pnpm --filter @getplumb/wiki build

      - name: Pack the published packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          # pnpm pack, not npm pack: it rewrites workspace:* into real versions.
          # npm would ship the literal range and every install would fail.
          for pkg in core wiki wiki-search-service; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -la "$RUNNER_TEMP/tarballs"

      - name: Install into a clean directory, as a user would
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_TEMP rather than /tmp: /tmp is not a real path on Windows.
          mkdir -p "$RUNNER_TEMP/plumb-smoke"
          cd "$RUNNER_TEMP/plumb-smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarballs/*.tgz

      - name: Fail if a native module crept back in
        shell: bash
        run: |
          set -euo pipefail
          # The engine is meant to need no compiler. A native dependency turns
          # "install the plugin" into "have a working C++ toolchain", which is
          # exactly what removing better-sqlite3 was for.
          if find "$RUNNER_TEMP/plumb-smoke/node_modules" -name '*.node' -print -quit | grep -q .; then
            echo "::error::A compiled native addon (.node) is present in the install tree."
            find "$RUNNER_TEMP/plumb-smoke/node_modules" -name '*.node' | head -20
            exit 1
          fi
          echo "No native addons — install needs no build toolchain."

      - name: Index, serve, and search
        shell: bash
        env:
          PLUMB_SMOKE_DIR: ${{ runner.temp }}/plumb-smoke
        run: node "$GITHUB_WORKSPACE/.github/scripts/smoke-test.mjs"

  # ----------------------------------------------------------------
  # Job 3: Multi-instance topology (Linux only)
  #
  # SO_REUSEPORT load balancing is a Linux behaviour, and no default install
  # exercises it -- which is how this code drifted untested before. It is opt-in
  # via REUSE_PORT, so without a job here it would rot again.
  # ----------------------------------------------------------------
  multi-instance:
    name: Multi-instance (SO_REUSEPORT, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @getplumb/core build
          pnpm --filter @getplumb/wiki build

      - name: Two instances behind one port
        shell: bash
        env:
          PLUMB_SMOKE_DIR: ${{ github.workspace }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/multi-instance-test.mjs"
