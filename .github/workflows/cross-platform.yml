name: Cross-Platform Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Run before publishing to catch issues early
  workflow_dispatch:
    inputs:
      run_install_smoke:
        description: 'Run full pack+install smoke test'
        type: boolean
        default: false
  # Callable so publish.yml can require this suite as a hard gate. The default
  # is true here, unlike workflow_dispatch: a release must never skip the only
  # layer that proves an install works on a machine that is not the maintainer's.
  workflow_call:
    inputs:
      run_install_smoke:
        description: 'Run full pack+install smoke test'
        type: boolean
        default: true

# -------------------------------------------------------------------
# STRATEGY
#
# Two layers, cheapest first.
#
# 1. build-and-unit — build the monorepo and run the unit suites on every
#    OS x Node combination. Catches path-separator bugs, ESM/CJS problems, and
#    anything that fails to compile on a platform.
#
#    Note what this layer CANNOT catch: the wiki-search-service suite skips
#    itself here, because its fixture is a snapshot of a real wiki kept in a
#    separate private repository. Skipping is the honest outcome -- inventing
#    assertions that pass without exercising retrieval would be worse. Layer 2
#    covers retrieval with a synthetic corpus instead.
#
# 2. install-smoke — pack the published packages, install them into a clean
#    directory the way a user would, then build an index, start the service and
#    run real queries against it. This is the layer that matters for a release:
#    it is the only place that proves an install works on a machine that is not
#    the maintainer's, and the only place a silent degradation to keyword-only
#    retrieval would be caught.
# -------------------------------------------------------------------

jobs:
  # ----------------------------------------------------------------
  # Job 1: Build + unit tests
  # ----------------------------------------------------------------
  build-and-unit:
    name: Build & Unit (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # see all failures, not just the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.5.0 is the exact floor (node:sqlite DatabaseSync); 22 and 24 are the
        # live LTS lines. Testing the floor itself catches an accidental
        # dependency on a later API.
        node: ['22.5.0', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      - name: Run unit tests
        run: pnpm test:ci
        env:
          # Vitest needs this on Windows to avoid interactive TTY issues
          CI: true

  # ----------------------------------------------------------------
  # Job 2: Pack + install + index + search
  # Simulates what a real user does, end to end.
  # ----------------------------------------------------------------
  install-smoke:
    name: Install Smoke (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # `inputs` resolves to the workflow_dispatch inputs on a manual run and to
    # the workflow_call inputs when publish.yml invokes this suite; on a plain
    # push or PR it is empty, which is why the event check comes first.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.run_install_smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.5.0', '22', '24']
        # Full OS coverage on the floor and on current; trim the middle line to
        # ubuntu to keep the matrix at 7 jobs rather than 9.
        exclude:
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @getplumb/core build
          pnpm --filter @getplumb/wiki build

      - name: Pack the published packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          # pnpm pack, not npm pack: it rewrites workspace:* into real versions.
          # npm would ship the literal range and every install would fail.
          for pkg in core wiki wiki-search-service; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -la "$RUNNER_TEMP/tarballs"

      - name: Install into a clean directory, as a user would
        shell: bash
        run: |
          set -euo pipefail
          # RUNNER_TEMP rather than /tmp: /tmp is not a real path on Windows.
          mkdir -p "$RUNNER_TEMP/plumb-smoke"
          cd "$RUNNER_TEMP/plumb-smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarballs/*.tgz

      # What "no build toolchain required" actually means here, and how it is
      # tested, because two earlier versions of this step got it wrong.
      #
      # v1 failed if any .node file existed in the tree. That failed all seven
      # jobs on onnxruntime-node and sharp, which ship PREBUILT N-API binaries
      # precisely so nothing compiles -- and because it failed first, the
      # retrieval smoke test below never ran once.
      #
      # v2 failed on any install/postinstall script. That would also have
      # failed, on sharp's `node install/check.js || npm run build`: a fallback
      # that compiles only when no prebuilt binary matches the platform. On
      # every platform this matrix covers it never fires, so failing on it
      # blocks the release for a condition that does not occur.
      #
      # So: hard-fail only on binding.gyp, which is unambiguous -- it is what
      # better-sqlite3 had, and removing that dependency is the property worth
      # defending. Install hooks are reported, not fatal. The real proof that
      # no toolchain was needed is the next step: if the ONNX runtime had not
      # loaded from a prebuilt binary, retrieval would fall back to BM25 and
      # the smoke test asserts that it does not.
      - name: Fail if anything in the install tree builds from source
        shell: bash
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/plumb-smoke/node_modules"

          gyps=$(find "$tree" -name 'binding.gyp' | head -20 || true)
          if [ -n "$gyps" ]; then
            echo "::error::binding.gyp found — this dependency compiles from source:"
            echo "$gyps"
            exit 1
          fi
          echo "No binding.gyp anywhere in the install tree."

          echo "Install hooks present (informational; fallbacks, not failures):"
          node -e '
            const {readdirSync, readFileSync, existsSync} = require("fs");
            const {join} = require("path");
            const out = [];
            const visit = (dir, depth) => {
              if (depth > 2 || !existsSync(dir)) return;
              for (const e of readdirSync(dir, {withFileTypes: true})) {
                if (!e.isDirectory()) continue;
                const p = join(dir, e.name);
                if (e.name.startsWith("@")) { visit(p, depth); continue; }
                try {
                  const pkg = JSON.parse(readFileSync(join(p, "package.json"), "utf8"));
                  for (const h of ["preinstall", "install", "postinstall"]) {
                    if (pkg.scripts?.[h]) out.push(`  ${pkg.name}: ${h} = ${pkg.scripts[h]}`);
                  }
                } catch {}
                visit(join(p, "node_modules"), depth + 1);
              }
            };
            visit(process.argv[1], 0);
            console.log(out.length ? out.join("\n") : "  (none)");
          ' "$tree"

          echo "Prebuilt binaries present (expected — no compiler required):"
          find "$tree" -name '*.node' | sed "s|$tree/||" | head -10

      - name: Index, serve, and search
        shell: bash
        env:
          PLUMB_SMOKE_DIR: ${{ runner.temp }}/plumb-smoke
        run: node "$GITHUB_WORKSPACE/.github/scripts/smoke-test.mjs"

  # ----------------------------------------------------------------
  # Job 3: Multi-instance topology (Linux only)
  #
  # SO_REUSEPORT load balancing is a Linux behaviour, and no default install
  # exercises it -- which is how this code drifted untested before. It is opt-in
  # via REUSE_PORT, so without a job here it would rot again.
  # ----------------------------------------------------------------
  multi-instance:
    name: Multi-instance (SO_REUSEPORT, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @getplumb/core build
          pnpm --filter @getplumb/wiki build

      - name: Two instances behind one port
        shell: bash
        env:
          PLUMB_SMOKE_DIR: ${{ github.workspace }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/multi-instance-test.mjs"
