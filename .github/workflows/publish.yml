name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: true
      dist_tag:
        description: 'Override the npm dist-tag (blank = derive from the version)'
        type: string
        default: ''

# Only one publish at a time
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm provenance: the OIDC token is what lets npm attest that
  # this tarball was built by this workflow from this commit.
  id-token: write

# -------------------------------------------------------------------
# STRUCTURE
#
# Four jobs, and the ordering is the point.
#
#   plan      resolve WHAT is being published and WHERE it lands
#   verify    the full cross-platform suite, as a hard gate
#   security  gitleaks + the PII pattern scan, as a hard gate
#   publish   only runs if all three succeeded
#
# Before this, a tag published regardless of whether the other workflows were
# red -- they ran in parallel and nothing consumed their result. A publish is
# irreversible after 72 hours, so the gate has to be a dependency, not a habit.
# -------------------------------------------------------------------

jobs:
  # ----------------------------------------------------------------
  # Job 1: Decide the version and the dist-tag, and refuse if they disagree
  # ----------------------------------------------------------------
  plan:
    name: Resolve version and dist-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # The publishable set. Keep in step with the pack loop below.
          PKGS="core wiki wiki-search-service wiki-worker plumb"

          # Every publishable package ships in lockstep, so disagreement is a
          # mistake rather than a choice. Catch it here: a split-version publish
          # cannot be undone, and `plumb` depending on a `wiki` version that was
          # never published is an install failure for everyone.
          version=""
          for pkg in $PKGS; do
            v="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ -z "$version" ]; then version="$v"; fi
            if [ "$v" != "$version" ]; then
              echo "::error::Version mismatch: packages/$pkg is $v, expected $version"
              exit 1
            fi
          done
          echo "All publishable packages agree on $version"

          # On a tag push the git tag is the declaration of intent. If it does
          # not match package.json, one of the two is wrong and we do not get to
          # guess which -- publishing 0.9.0 from a tag reading v1.0.0 produces a
          # release nobody can find and a tag that points at nothing.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME implies $tag_version but the packages are at $version"
              exit 1
            fi
          fi

          # Dist-tag derivation.
          #
          # npm publish defaults to --tag latest for EVERY version, including
          # semver prereleases. Publishing 1.0.0-rc.1 with no --tag therefore
          # makes the release candidate the default install for every user --
          # the precise opposite of what a release candidate is for. So the tag
          # is derived, never defaulted:
          #
          #   1.0.0        -> latest   (the default install)
          #   1.0.0-rc.1   -> next     (opt-in: npm install @getplumb/wiki@next)
          #   1.0.0-beta.3 -> next
          #
          # Any hyphen means a prerelease under semver, so one rule covers rc,
          # beta, alpha and anything else without a lookup table to forget.
          override="${{ inputs.dist_tag }}"
          case "$version" in
            *-*) derived="next";  prerelease="true"  ;;
            *)   derived="latest"; prerelease="false" ;;
          esac
          dist_tag="${override:-$derived}"

          if [ -n "$override" ] && [ "$override" != "$derived" ]; then
            echo "::warning::dist-tag overridden: $derived -> $override"
          fi

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          {
            echo "### Publish plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$version\` |"
            echo "| npm dist-tag | \`$dist_tag\` |"
            echo "| Prerelease | $prerelease |"
            echo ""
            if [ "$dist_tag" = "latest" ]; then
              echo "This becomes the default install for everyone."
            else
              echo "Opt-in only: \`npm install @getplumb/wiki@$dist_tag\`. \`latest\` is untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------
  # Job 2: The cross-platform suite, as a gate rather than a parallel hope
  # ----------------------------------------------------------------
  verify:
    name: Verify
    needs: plan
    uses: ./.github/workflows/cross-platform.yml
    with:
      run_install_smoke: true
    secrets: inherit

  # ----------------------------------------------------------------
  # Job 3: Secrets and PII, same deal. Needs `secrets: inherit` for PII_PATTERNS.
  # ----------------------------------------------------------------
  security:
    name: Security
    needs: plan
    uses: ./.github/workflows/pii-scan.yml
    secrets: inherit

  # ----------------------------------------------------------------
  # Job 4: Publish
  # ----------------------------------------------------------------
  publish:
    name: Build & Publish
    needs: [plan, verify, security]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Must stay at or above the engines floor (>=22.16): the wiki index is
          # read through node:sqlite, which does not exist below it.
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      # Two tools, because neither can do the whole job:
      #
      #   pnpm pack rewrites `workspace:*` ranges into real versions. npm cannot
      #   do this, and publishing with npm directly would ship the literal
      #   string `workspace:*` as a dependency range, breaking every install.
      #
      #   npm publish supports --provenance. pnpm (10.30.3) has no such flag, so
      #   publishing with pnpm would silently produce unattested packages.
      #
      # Packing with one and publishing the tarball with the other gets both.
      - name: Pack publishable packages
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          # Order matters only for readability -- npm does not validate
          # dependency existence at publish time -- but publishing a dependency
          # before its dependents keeps the registry consistent at every moment.
          for pkg in core wiki wiki-search-service wiki-worker plumb; do
            dir="packages/$pkg"
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "skip $pkg (private)"
              continue
            fi
            echo "::group::pack $pkg"
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
            echo "::endgroup::"
          done
          ls -la dist-tarballs

      # Catches the failure mode this repo has actually hit: a workspace range
      # escaping into a published artifact, where it is unfixable for 72 hours.
      - name: Verify no workspace ranges escaped into the tarballs
        run: |
          set -euo pipefail
          fail=0
          for tgz in dist-tarballs/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "::error::$tgz still contains a workspace: dependency range"
              fail=1
            fi
          done
          exit $fail

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          set -euo pipefail
          # "./$tgz", not "$tgz". A relative path containing a slash is read by
          # npm as a GitHub owner/repo shorthand, not a file, so the bare form
          # sent it looking for a git remote and the publish died on the first
          # tarball:
          #   npm error command git ls-remote
          #     ssh://git@github.com/dist-tarballs/getplumb-core-1.0.0-rc.1.tgz.git
          # Nothing published, so the failure was at least clean.
          for tgz in dist-tarballs/*.tgz; do
            npm publish "./$tgz" --access public --provenance \
              --tag "${{ needs.plan.outputs.dist_tag }}" --dry-run
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          set -euo pipefail
          # "./$tgz", not "$tgz". A relative path containing a slash is read by
          # npm as a GitHub owner/repo shorthand, not a file, so the bare form
          # sent it looking for a git remote and the publish died on the first
          # tarball:
          #   npm error command git ls-remote
          #     ssh://git@github.com/dist-tarballs/getplumb-core-1.0.0-rc.1.tgz.git
          # Nothing published, so the failure was at least clean.
          for tgz in dist-tarballs/*.tgz; do
            npm publish "./$tgz" --access public --provenance \
              --tag "${{ needs.plan.outputs.dist_tag }}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise what landed
        if: success()
        run: |
          {
            echo "### Published \`${{ needs.plan.outputs.version }}\` to dist-tag \`${{ needs.plan.outputs.dist_tag }}\`"
            echo ""
            if [ "${{ needs.plan.outputs.dist_tag }}" != "latest" ]; then
              echo "\`latest\` is unchanged. Promote with:"
              echo ""
              echo '```'
              for pkg in @getplumb/core @getplumb/wiki @getplumb/wiki-search-service @getplumb/wiki-worker @getplumb/plumb; do
                echo "npm dist-tag add \$pkg@${{ needs.plan.outputs.version }} latest"
              done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A prerelease tag must not show as the repository's current release.
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          files: dist-tarballs/*.tgz
